<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>라이언 포모도로 타이머</title>
<style>
  :root{
    --bg:#FEE500; --bg2:#FFF4A8; --ink:#3A1D1D; --card:#FFFDF2;
    --ryan:#F6B93B; --ryan-d:#E09A1A; --muzzle:#FCE3A8; --accent:#E5533D; --break:#3FA796;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,var(--bg2),var(--bg));
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;color:var(--ink);transition:background .6s}
  body.break{--bg:#BFEFE3;--bg2:#E6FAF4}
  .app{width:min(92vw,420px);background:var(--card);border-radius:32px;padding:24px 24px 28px;box-shadow:0 12px 0 rgba(58,29,29,.12),0 24px 40px rgba(58,29,29,.15);text-align:center}
  h1{font-size:18px;margin:0 0 14px;letter-spacing:-.02em}
  .tabs{display:flex;gap:6px;background:#F3EBC4;border-radius:999px;padding:4px;margin-bottom:14px}
  .tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 0;font:inherit;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;opacity:.6}
  .tabs button.on{background:var(--ink);color:#fff;opacity:1}
  .stage{position:relative;width:260px;height:260px;margin:0 auto}
  .stage svg.ring{position:absolute;inset:0}
  .ring circle{fill:none;stroke-width:12;stroke-linecap:round}
  .ring .track{stroke:#F3EBC4}
  .ring .bar{stroke:var(--accent);transition:stroke .4s}
  body.break .ring .bar{stroke:var(--break)}
  #ryan{position:absolute;right:-14px;bottom:-4px;width:84px;z-index:2}
  .me{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;overflow:hidden;
    border:6px solid var(--ink);background:#c9cbd6;box-shadow:0 6px 0 rgba(58,29,29,.25);transition:border-color .4s}
  .me img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transform:scale(1.7);transform-origin:50% 14%;display:block}
  body.running:not(.break) .me{animation:bob2 1.4s ease-in-out infinite}
  body.break .me{border-color:var(--break);animation:breathe2 3s ease-in-out infinite}
  body.done .me{animation:hop2 .6s ease-in-out infinite}
  @keyframes bob2{50%{transform:translateY(-4px) rotate(-2deg)}}
  @keyframes breathe2{50%{transform:scale(1.04)}}
  @keyframes hop2{50%{transform:translateY(-10px) rotate(3deg)}}
  .bubble{position:relative;display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-weight:700;font-size:14px;margin:6px 0 4px}
  .bubble:before{content:"";position:absolute;top:-11px;left:50%;margin-left:-8px;border:8px solid transparent;border-bottom-color:var(--ink);border-top:0}
  .time{font-size:64px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
  .ctrl{display:flex;gap:10px;justify-content:center;margin-top:12px}
  .ctrl button{font:inherit;font-weight:800;font-size:16px;border:3px solid var(--ink);border-radius:999px;padding:10px 26px;cursor:pointer;background:var(--bg);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
  .ctrl button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  .ctrl .sub{background:#fff}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left}
  .stat{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 1px 0 rgba(58,29,29,.06),0 6px 16px -8px rgba(58,29,29,.25);display:flex;align-items:center;gap:10px}
  .stat small{display:block;font-size:11px;font-weight:600;color:rgba(58,29,29,.55)}
  .stat b{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.02em}
  .stat .ico{width:38px;height:38px;border-radius:12px;background:#FFE9E4;display:grid;place-items:center;font-size:20px;flex:none}
  .stat.col{flex-direction:column;align-items:flex-start;gap:8px;justify-content:center}
  .dots{display:flex;gap:5px;width:100%}
  .dots i{flex:1;height:10px;border-radius:999px;background:#F1ECD2;transition:background .3s}
  .dots i.f{background:linear-gradient(90deg,#F6B93B,#F29B1D)}
  .cfg{margin-top:10px;background:#fff;border-radius:20px;padding:14px;box-shadow:0 1px 0 rgba(58,29,29,.06),0 6px 16px -8px rgba(58,29,29,.25)}
  .cfg-title{font-size:12px;font-weight:700;color:rgba(58,29,29,.55);text-align:left;margin:0 2px 10px}
  .steppers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .step small{display:block;font-size:11px;font-weight:700;color:rgba(58,29,29,.6);margin-bottom:6px}
  .step .row{display:flex;align-items:center;justify-content:space-between;background:#F7F3E0;border-radius:999px;padding:3px}
  .step .row button{width:26px;height:26px;border:0;border-radius:50%;background:#fff;color:var(--ink);font:800 15px/1 inherit;cursor:pointer;box-shadow:0 1px 3px rgba(58,29,29,.18);transition:transform .1s,background .2s}
  .step .row button:hover{background:var(--bg)}
  .step .row button:active{transform:scale(.88)}
  .step input{width:34px;border:0;background:transparent;text-align:center;font:800 15px inherit;color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}
  .step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .step input:focus{outline:none}
  .help{margin:14px 0 0;font-size:12px;color:rgba(58,29,29,.6);line-height:1.6}
  .help kbd{font:700 11px inherit;background:#fff;border-radius:6px;padding:2px 7px;box-shadow:0 1px 0 rgba(58,29,29,.25)}

  /* 라이언 애니메이션 */
  #ryan .head{transform-origin:100px 150px}
  body.running:not(.break) #ryan .head{animation:bob 1.4s ease-in-out infinite}
  body.break #ryan{animation:breathe 3s ease-in-out infinite}
  body.done #ryan{animation:hop .6s ease-in-out infinite}
  @keyframes bob{50%{transform:rotate(-3deg) translateY(2px)}}
  @keyframes breathe{50%{transform:scale(1.06)}}
  @keyframes hop{50%{transform:translateY(-10px)}}
  .brow{transform-box:fill-box;transform-origin:center;transition:transform .3s}
  .eye-open,.eye-closed{transition:opacity .2s}
  .eye-closed{opacity:0}
  body.break .eye-open,body.done .eye-open{opacity:0}
  body.break .eye-closed,body.done .eye-closed{opacity:1}
  body.running:not(.break) .brow.l{transform:rotate(12deg)}
  body.running:not(.break) .brow.r{transform:rotate(-12deg)}
  .mouth-smile{opacity:0}
  body.break .mouth-smile,body.done .mouth-smile{opacity:1}
  body.break .mouth-flat,body.done .mouth-flat{opacity:0}
  .blush{opacity:0;transition:opacity .3s}
  body.break .blush,body.done .blush{opacity:.55}
  .zzz{opacity:0;font:800 22px sans-serif;fill:var(--ink)}
  body.break.running .zzz{opacity:1;animation:z 2s ease-in-out infinite}
  @keyframes z{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-18px);opacity:0}}
</style>
</head>

        <rect class="brow r" x="118" y="78" width="34" height="10" rx="5" fill="#3A1D1D"/>
        <!-- 눈 -->
        <g class="eye-open"><circle cx="66" cy="104" r="6" fill="#3A1D1D"/><circle cx="134" cy="104" r="6" fill="#3A1D1D"/></g>
        <g class="eye-closed" fill="none" stroke="#3A1D1D" stroke-width="5" stroke-linecap="round">
          <path d="M57 106 Q66 97 75 106"/><path d="M125 106 Q134 97 143 106"/></g>
        <!-- 볼터치 -->
        <ellipse class="blush" cx="50" cy="126" rx="10" ry="6" fill="#F08A6B"/>
        <ellipse class="blush" cx="150" cy="126" rx="10" ry="6" fill="#F08A6B"/>
        <!-- 코/입 -->
        <ellipse cx="100" cy="126" rx="9" ry="6" fill="#3A1D1D"/>
        <path class="mouth-flat" d="M92 142 Q100 147 108 142" fill="none" stroke="#3A1D1D" stroke-width="4" stroke-linecap="round"/>
        <path class="mouth-smile" d="M88 140 Q100 158 112 140" fill="#B8412C" stroke="#3A1D1D" stroke-width="4" stroke-linejoin="round"/>
      </g>
      <text class="zzz" x="150" y="40">z</text>
    </svg>
  </div>

  <div class="bubble" id="say">오늘도 같이 집중해 볼까?</div>
  <div class="time" id="time">25:00</div>

  <div class="ctrl">
    <button id="go">시작</button>
    <button id="reset" class="sub">리셋</button>
  </div>

  <section class="stats">
    <div class="stat"><div class="ico">🍅</div><div><b id="cnt">0</b><small>오늘 완료</small></div></div>
    <div class="stat col"><small>긴 휴식까지</small><div class="dots" id="dots"></div></div>
  </section>

  <section class="cfg">
    <div class="cfg-title">⏱ 시간 설정 (분)</div>
    <div class="steppers">
      <div class="step"><small>집중</small><div class="row"><button data-t="cf" data-d="-5" aria-label="집중 줄이기">−</button><input id="cf" type="number" min="1" max="120" value="25"><button data-t="cf" data-d="5" aria-label="집중 늘리기">+</button></div></div>
      <div class="step"><small>짧은 휴식</small><div class="row"><button data-t="cs" data-d="-1" aria-label="짧은 휴식 줄이기">−</button><input id="cs" type="number" min="1" max="60" value="5"><button data-t="cs" data-d="1" aria-label="짧은 휴식 늘리기">+</button></div></div>
      <div class="step"><small>긴 휴식</small><div class="row"><button data-t="cl" data-d="-5" aria-label="긴 휴식 줄이기">−</button><input id="cl" type="number" min="1" max="60" value="15"><button data-t="cl" data-d="5" aria-label="긴 휴식 늘리기">+</button></div></div>
    </div>
  </section>
  <p class="help"><kbd>Space</kbd> 로 시작/일시정지 · 집중 4번마다 긴 휴식이 와요</p>
</main>

<script>
const $ = id => document.getElementById(id);
const C = 2*Math.PI*120;
const bar = $('bar'); bar.style.strokeDasharray = C;
const cfgIds = {focus:'cf', short:'cs', long:'cl'};
const say = {
  focus:['오늘도 같이 집중해 볼까?','하나만 끝내 보자! 파이팅!','라이언이 옆에서 지켜볼게 👀'],
  running:['집중 집중... 눈빛이 달라졌어!','잘하고 있어! 조금만 더!','딴짓은 나중에~ 지금은 집중!'],
  short:['잠깐 쉬어가자~','물 한 잔 마셔요 💧'],
  long:['푹 쉬어도 돼요, 고생했어요','스트레칭 한 번 쭉~ 🙆'],
  resting:['쿨쿨... 쉬는 중...','눈 감고 멍 때리기~'],
  done:['짠! 한 뽀모 완료! 🎉','수고했어요! 최고예요!'],
  paused:['잠깐 멈췄어요. 다시 할까요?']
};
const pick = a => a[Math.floor(Math.random()*a.length)];

let mode='focus', running=false, endAt=0, left=0, tick=null;
let st = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem('ryan-pomo')||'{}'); const t=new Date().toDateString();
  return s.date===t ? s : {date:t,count:0,focus:25,short:5,long:15}; }catch(e){ return {date:new Date().toDateString(),count:0,focus:25,short:5,long:15}; } }
function save(){ try{ localStorage.setItem('ryan-pomo',JSON.stringify(st)); }catch(e){} }

for(const [m,id] of Object.entries(cfgIds)){
  $(id).value = st[m];
  $(id).addEventListener('change',()=>{ st[m]=Math.max(1,+$(id).value||st[m]); $(id).value=st[m]; save(); if(!running&&m===mode) setMode(mode); });
}
const total = () => st[mode]*60;

function fmt(s){ s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function render(){
  $('time').textContent = fmt(left);
  bar.style.strokeDashoffset = C*(1-left/total());
  document.title = (running?fmt(left)+' · ':'')+'라이언 포모도로';
  $('cnt').textContent = st.count;
  $('dots').innerHTML = [0,1,2,3].map(i=>`<i class="${i<st.count%4||(st.count>0&&st.count%4===0&&mode==='long')?'f':''}"></i>`).join('');
}
function body(){
  document.body.classList.toggle('break', mode!=='focus');
  document.body.classList.toggle('running', running);
}
function setMode(m){
  mode=m; running=false; clearInterval(tick); left=total();
  document.body.classList.remove('done');
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));
  $('go').textContent='시작'; $('say').textContent=pick(say[m]); body(); render();
}
function start(){
  document.body.classList.remove('done');
  running=true; endAt=Date.now()+left*1000; $('go').textContent='일시정지';
  $('say').textContent = pick(mode==='focus'?say.running:say.resting); body();
  clearInterval(tick); tick=setInterval(step,250); step();
}
function pause(){
  running=false; clearInterval(tick); $('go').textContent='계속'; $('say').textContent=pick(say.paused); body(); render();
}
function step(){
  left=(endAt-Date.now())/1000;
  if(left<=0){ left=0; finish(); return; }
  render();
}
function finish(){
  clearInterval(tick); running=false; render();
  beep();
  if(mode==='focus'){ st.count++; save(); }
  const next = mode==='focus' ? (st.count%4===0?'long':'short') : 'focus';
  const msg = mode==='focus' ? '한 뽀모 완료! 이제 쉬어요' : '휴식 끝! 다시 집중해 볼까?';
  setMode(next);
  document.body.classList.add('done');
  $('say').textContent = mode==='focus' ? msg : pick(say.done)+' '+'쉬는 시간이에요';
  if('Notification' in window && Notification.permission==='granted') new Notification('라이언 포모도로',{body:msg});
  render();
}
function beep(){
  try{
    const a=new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach((d,i)=>{ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.value=[660,880,1040][i];
      g.gain.setValueAtTime(.0001,a.currentTime+d); g.gain.exponentialRampToValueAtTime(.25,a.currentTime+d+.03); g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d+.22);
      o.connect(g).connect(a.destination); o.start(a.currentTime+d); o.stop(a.currentTime+d+.25); });
  }catch(e){}
}

$('go').onclick = ()=>{ if(running) pause(); else { if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); start(); } };
$('reset').onclick = ()=> setMode(mode);
$('tabs').onclick = e=>{ const b=e.target.closest('button'); if(b) setMode(b.dataset.mode); };
document.addEventListener('keydown',e=>{ if(e.code==='Space' && !/INPUT/.test(e.target.tagName)){ e.preventDefault(); $('go').click(); }});

document.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{
  const i=$(b.dataset.t); i.value=Math.min(+i.max,Math.max(+i.min,(+i.value||0)+ +b.dataset.d)); i.dispatchEvent(new Event('change'));
});
setMode('focus');
</script>
</body>
</html>
